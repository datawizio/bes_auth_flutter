name: bes_auth_flutter
description: Plugin for easy implements "BES" authorization in your app.
version: 0.2.0
homepage: https://datawiz.io/
repository: https://github.com/datawizio/bes_auth_flutter.git

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  http: any
  # Vendored 5.0.3 with two patches (see third_party/flutter_web_auth_2):
  # 1) CallbackActivity delivers the callback to the single pending session even
  #    when the arriving scheme differs from the registered one (needed for the
  #    backend's per-browser redirect rewriting: app:// for Chromium, https App
  #    Link for Firefox).
  # 2) Restored KEEP_ALIVE wiring (browser binds KeepAliveService; helps older
  #    Chromium builds keep the app process from being frozen mid-auth).
  flutter_web_auth_2:
    path: third_party/flutter_web_auth_2
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.example.bes_auth_flutter
        pluginClass: BesAuthFlutterPlugin
      ios:
        pluginClass: BesAuthFlutterPlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
